services:
  vishnoi:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://vishnoi.doctorsatdoor.com
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Turnstile site key required}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NEXT_PUBLIC_SITE_URL: https://vishnoi.doctorsatdoor.com
    ports:
      - "127.0.0.1:3100:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 150
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
