# Install in the nginx http context only after checking existing virtual hosts.
# This initial configuration supports certificate issuance. Certbot adds HTTPS.
limit_req_zone $binary_remote_addr zone=vishnoi_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=vishnoi_connections:10m;
server {
    listen 80;
    server_name vishnoi.doctorsatdoor.com;
    server_tokens off;
    client_max_body_size 32m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    limit_conn vishnoi_connections 15;
    limit_req_status 429;

    location ~ /\. { deny all; }
    location /api/ {
        limit_req zone=vishnoi_api burst=15 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # Overwrite client-supplied forwarding headers. Never append them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
